<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Chatbot AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <nav>
            <a href="/">Zapytaj AI</a> |
            <a href="/analiza-strona">Analizuj dane</a> |
            <a href="/wyloguj">Wyloguj</a>
        </nav>

        <h1>Zapytaj AI</h1>

        <form action="/zapytaj" method="POST">
            <textarea
                name="pytanie"
                id="pytanie"
                rows="4"
                placeholder="Wpisz swoje pytanie..."
            >{{ pytanie or '' }}</textarea>
            <button type="submit">Wyślij</button>
        </form>

        {% if odpowiedz %}
        <div class="answer-box">
            <p style="white-space: pre-wrap; margin: 0;">{{ odpowiedz }}</p>
        </div>
        {% endif %}
    </main>
</body>
</html>
